name: smoke-test-fuzzy-search

# Throwaway: verifies the deployed GET /api/search route (not just the
# isolated fuzzy-search.ts unit) actually returns typo-tolerant results in
# production. Remove once confirmed.
on:
  workflow_dispatch:

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Try queries
        run: |
          for q in "sasmung" "sonny" "plystation"; do
            echo "=== query: [$q] ==="
            curl -sS -G "https://eshopping-ai.vercel.app/api/search" \
              --data-urlencode "q=$q" \
              --max-time 30 > out.json
            count=$(jq '.products | length' out.json)
            echo "  $count result(s):"
            jq -r '.products[]?.title_en // empty' out.json | sed 's/^/    - /'
            echo
          done
