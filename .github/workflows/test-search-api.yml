name: test-search-api

# Throwaway diagnostic: calls the deployed GET /api/search endpoint (as-you-type
# search over already-tracked products) with several real-world-ish queries to
# see what Postgres full-text search actually returns today, since this
# sandbox's own network can't reach the live site. Remove once done.
on:
  workflow_dispatch:

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Try queries
        run: |
          for q in "iphone" "iphon" "ايفون" "iphone 17" "17" "sasmung" "samsung"; do
            echo "=== query: $q ==="
            curl -sS -G "https://eshopping-ai.vercel.app/api/search" \
              --data-urlencode "q=$q" \
              -w "\nHTTP_STATUS:%{http_code}\n" \
              --max-time 30 | python3 -c "
import json,sys
raw = sys.stdin.read()
try:
    body, status = raw.rsplit('HTTP_STATUS:', 1)
    data = json.loads(body)
    products = data.get('products', [])
    print(f'  {len(products)} result(s):')
    for p in products[:8]:
        print(f\"    - {p.get('title_en')}\")
except Exception as e:
    print('  (parse error)', e)
    print(raw[:500])
"
            echo
          done
