name: test-search-api

# Throwaway diagnostic: calls the deployed GET /api/search endpoint (as-you-type
# search over already-tracked products) with several real-world-ish queries to
# see what Postgres full-text search actually returns today, since this
# sandbox's own network can't reach the live site. Remove once done.
on:
  workflow_dispatch:

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Try queries
        run: |
          for q in "" "iphone" "iphon" "ايفون" "iphone 17" "17" "sasmung" "samsung" "playstation" "ps5" "sony"; do
            echo "=== query: [$q] ==="
            curl -sS -G "https://eshopping-ai.vercel.app/api/search" \
              --data-urlencode "q=$q" \
              --max-time 30 > out.json
            count=$(jq '.products | length' out.json)
            echo "  $count result(s):"
            jq -r '.products[]?.title_en // empty' out.json | sed 's/^/    - /'
            echo
          done
