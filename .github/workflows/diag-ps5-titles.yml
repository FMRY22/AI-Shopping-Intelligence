name: Diagnostic -- dump PS5 product titles/specs
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: GET /api/search
        run: |
          curl -sS "https://ai-shopping-intelligence-seven.vercel.app/api/search?q=ps5" | node -e "
            let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{
              const j=JSON.parse(d);
              for (const p of (j.products||[])) {
                console.log(JSON.stringify({ title_en: p.title_en, retailer_id: p.retailer_id, current_price: p.current_price, specs: p.specs }));
              }
            });
          "
          echo "--- also try 'playstation' ---"
          curl -sS "https://ai-shopping-intelligence-seven.vercel.app/api/search?q=playstation" | node -e "
            let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{
              const j=JSON.parse(d);
              for (const p of (j.products||[])) {
                console.log(JSON.stringify({ title_en: p.title_en, retailer_id: p.retailer_id, current_price: p.current_price, specs: p.specs }));
              }
            });
          "
