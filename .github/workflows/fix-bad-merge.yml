name: Fix bad merge -- unmerge Nintendo Switch 2 from PS5 group
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Clear group_key on the wrongly-merged Nintendo Switch 2 listing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e '
          const SUPABASE_URL = process.env.SUPABASE_URL;
          const KEY = process.env.SUPABASE_SERVICE_ROLE_KEY;

          async function main() {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/products?select=id,title_en,specs`, {
              headers: { apikey: KEY, Authorization: `Bearer ${KEY}` },
            });
            if (!res.ok) throw new Error(`fetch failed: ${res.status} ${await res.text()}`);
            const products = await res.json();

            const target = products.find((p) => p.title_en.toLowerCase().includes("nintendo switch 2"));
            if (!target) {
              console.log("No Nintendo Switch 2 product found -- nothing to fix (maybe already fixed).");
              return;
            }
            console.log("Found:", JSON.stringify({ id: target.id, title_en: target.title_en, specs: target.specs }));

            const newSpecs = { ...(target.specs || {}) };
            delete newSpecs.group_key;

            const patchRes = await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${target.id}`, {
              method: "PATCH",
              headers: {
                apikey: KEY,
                Authorization: `Bearer ${KEY}`,
                "Content-Type": "application/json",
                Prefer: "return=representation",
              },
              body: JSON.stringify({ specs: Object.keys(newSpecs).length > 0 ? newSpecs : null }),
            });
            if (!patchRes.ok) throw new Error(`PATCH failed: ${patchRes.status} ${await patchRes.text()}`);
            const updated = await patchRes.json();
            console.log("Fixed. New specs:", JSON.stringify(updated[0].specs));
          }

          main().catch((err) => { console.error(err); process.exit(1); });
          '
