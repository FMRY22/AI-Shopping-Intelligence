name: Backfill dry-run -- log proposed clusters only, no writes
on:
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Cluster products (fixed matcher) and log proposal -- no PATCH
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e '
          const SUPABASE_URL = process.env.SUPABASE_URL;
          const KEY = process.env.SUPABASE_SERVICE_ROLE_KEY;

          // Port of apps/web/src/lib/product-groups.ts (round 3) -- kept in
          // sync manually, this is a one-time throwaway script, not shared code.
          const OVERLAP_THRESHOLD = 0.5;
          const ALIAS_PATTERNS = [[/playstation\s*(\d)/g, "ps$1"]];
          const TOKEN_SYNONYMS = { generation: "gen", dig: "digital" };
          const STOPWORDS = new Set(["warranty","manufacturer","year","years","ksa","international","intl","global","gcc","console","version"]);

          function preprocessTitle(title) {
            let t = title.toLowerCase();
            for (const [pattern, replacement] of ALIAS_PATTERNS) t = t.replace(pattern, replacement);
            t = t.replace(/(\d)\s+(gb|tb|mp|mah|inch)\b/g, "$1$2");
            t = t.replace(/-/g, "");
            return t.replace(/'"'"'/g, "");
          }
          function normalizeTitleTokens(title) {
            const joined = preprocessTitle(title);
            return new Set(
              joined.replace(/[^\p{L}\p{N}\s]/gu, " ").split(/\s+/).filter(Boolean)
                .map((t) => TOKEN_SYNONYMS[t] || t)
                .filter((t) => !STOPWORDS.has(t))
            );
          }
          function titleSimilarity(a, b) {
            const A = normalizeTitleTokens(a), B = normalizeTitleTokens(b);
            if (!A.size || !B.size) return 0;
            let i = 0;
            for (const t of A) if (B.has(t)) i++;
            return i / Math.min(A.size, B.size);
          }
          const SIZE_UNIT_PATTERN = /(\d+(?:\.\d+)?)\s?(gb|tb|mp|mah|inch)\b/g;
          function extractSizeByUnit(title) {
            const result = new Map();
            for (const m of title.toLowerCase().matchAll(SIZE_UNIT_PATTERN)) {
              const unit = m[2], value = parseFloat(m[1]);
              const list = result.get(unit);
              if (list) list.push(value); else result.set(unit, [value]);
            }
            return result;
          }
          function hasConflictingSizes(a, b) {
            const sa = extractSizeByUnit(a), sb = extractSizeByUnit(b);
            for (const [unit, va] of sa) {
              const vb = sb.get(unit);
              if (!vb) continue;
              if (Math.max(...va) !== Math.max(...vb)) return true;
            }
            return false;
          }
          function trailingDigitSplit(token) {
            const m = /^([a-z].*?)(\d+)$/.exec(token);
            if (!m) return null;
            return { prefix: m[1], digits: m[2] };
          }
          function hasConflictingModelCode(tA, tB) {
            for (const a of tA) {
              const sa = trailingDigitSplit(a);
              if (!sa) continue;
              for (const b of tB) {
                const sb = trailingDigitSplit(b);
                if (sb && sa.prefix === sb.prefix && sa.digits !== sb.digits) return true;
              }
            }
            return false;
          }
          const DISTINGUISHING_WORDS = [
            "pro","ultra","plus","max","mini","lite","se","air","note",
            "buds","watch","tablet","laptop","headphones","earbuds",
            "tv","camera","speaker","keyboard","mouse","monitor",
          ];
          function hasConflictingDistinguishingWord(tA, tB) {
            return DISTINGUISHING_WORDS.some((w) => tA.has(w) !== tB.has(w));
          }
          function bareNumberTokens(tokens) {
            return new Set([...tokens].filter((t) => /^\d{1,3}$/.test(t)));
          }
          function hasConflictingBareNumbers(tA, tB) {
            const nA = bareNumberTokens(tA), nB = bareNumberTokens(tB);
            if (nA.size === 0 || nB.size === 0) return false;
            for (const n of nA) if (nB.has(n)) return false;
            return true;
          }
          const CONFLICTING_KEYWORD_GROUPS = [["disc","digital"],["wifi","cellular"],["new","refurbished","used"]];
          function hasConflictingKeywordGroup(tA, tB) {
            return CONFLICTING_KEYWORD_GROUPS.some((g) => {
              const inA = g.filter((w) => tA.has(w));
              const inB = g.filter((w) => tB.has(w));
              return inA.length > 0 && inB.length > 0 && !inA.some((w) => inB.includes(w));
            });
          }
          function isSameProduct(a, b) {
            if (hasConflictingSizes(a, b)) return { match: false };
            const tA = normalizeTitleTokens(a), tB = normalizeTitleTokens(b);
            if (hasConflictingModelCode(tA, tB)) return { match: false };
            if (hasConflictingDistinguishingWord(tA, tB)) return { match: false };
            if (hasConflictingKeywordGroup(tA, tB)) return { match: false };
            if (hasConflictingBareNumbers(tA, tB)) return { match: false };
            const overlap = titleSimilarity(a, b);
            return { match: overlap >= OVERLAP_THRESHOLD, overlap };
          }

          async function main() {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/products?select=id,title_en,specs,current_price`, {
              headers: { apikey: KEY, Authorization: `Bearer ${KEY}` },
            });
            if (!res.ok) throw new Error(`fetch products failed: ${res.status} ${await res.text()}`);
            const products = await res.json();
            console.log(`Loaded ${products.length} tracked products\n`);
            for (const p of products) console.log(`[${p.id.slice(0,8)}] group=${(p.specs && p.specs.group_key) || "none"} :: ${p.title_en.replace(/\n/g, " ")}`);
            console.log("");

            const parent = new Map(products.map((p) => [p.id, p.id]));
            function find(x) { while (parent.get(x) !== x) { parent.set(x, parent.get(parent.get(x))); x = parent.get(x); } return x; }
            function union(x, y) { const rx = find(x), ry = find(y); if (rx !== ry) parent.set(rx, ry); }

            const byGroupKey = new Map();
            for (const p of products) {
              const gk = p.specs && p.specs.group_key;
              if (!gk) continue;
              const list = byGroupKey.get(gk);
              if (list) list.push(p); else byGroupKey.set(gk, [p]);
            }
            for (const list of byGroupKey.values()) {
              for (let i = 1; i < list.length; i++) union(list[0].id, list[i].id);
            }

            for (let i = 0; i < products.length; i++) {
              for (let j = i + 1; j < products.length; j++) {
                const result = isSameProduct(products[i].title_en, products[j].title_en);
                if (result.match) {
                  console.log(`MATCH (overlap=${result.overlap.toFixed(2)}): "${products[i].title_en.replace(/\n/g," ").slice(0,60)}" <-> "${products[j].title_en.replace(/\n/g," ").slice(0,60)}"`);
                  union(products[i].id, products[j].id);
                }
              }
            }

            const clusters = new Map();
            for (const p of products) {
              const root = find(p.id);
              const list = clusters.get(root);
              if (list) list.push(p); else clusters.set(root, [p]);
            }

            console.log("\n=== PROPOSED CLUSTERS (dry run, nothing written) ===");
            let anyChange = false;
            for (const members of clusters.values()) {
              if (members.length < 2) continue;
              const existingKeys = members.map((m) => m.specs && m.specs.group_key).filter(Boolean);
              let canonicalKey;
              if (existingKeys.length > 0) {
                const counts = new Map();
                for (const k of existingKeys) counts.set(k, (counts.get(k) || 0) + 1);
                canonicalKey = [...counts.entries()].sort((a, b) => b[1] - a[1])[0][0];
              } else {
                canonicalKey = members[0].title_en.toLowerCase().trim().replace(/\s+/g, " ");
              }
              const needsUpdate = members.filter((m) => (m.specs && m.specs.group_key) !== canonicalKey);
              if (needsUpdate.length === 0) continue;
              anyChange = true;
              console.log(`\nCluster "${canonicalKey}": ${members.length} items, WOULD update ${needsUpdate.length}`);
              for (const m of members) console.log(`  - [${(m.specs && m.specs.group_key) || "none"}] ${m.title_en.replace(/\n/g, " ")}`);
            }
            if (!anyChange) console.log("(no changes proposed)");
          }

          main().catch((err) => { console.error(err); process.exit(1); });
          '
