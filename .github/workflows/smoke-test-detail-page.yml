name: Smoke test product detail page
on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/favorite to create a real tracked test product
        id: post
        run: |
          set -e
          UNIQUE="smoke-detail-$(date +%s)"
          TITLE="Smoke Detail Page Test ${UNIQUE}"
          BODY=$(curl -sS -X POST "https://ai-shopping-intelligence-seven.vercel.app/api/favorite" \
            -H "Content-Type: application/json" \
            -d "{\"retailerSlug\":\"jarir\",\"url\":\"https://www.jarir.com/sa-en/${UNIQUE}.html\",\"title\":\"${TITLE}\",\"price\":77.77,\"currency\":\"SAR\",\"imageUrl\":null,\"groupKey\":\"smoke-detail-page-test\"}")
          echo "Response: $BODY"
          PRODUCT_ID=$(echo "$BODY" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);if(!j.product||!j.product.id)throw new Error('no product.id: '+d);console.log(j.product.id);});")
          echo "product_id=$PRODUCT_ID" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "PASS: created product_id=$PRODUCT_ID"

      - name: GET the detail page and check it actually renders the product
        run: |
          set -e
          TITLE="${{ steps.post.outputs.title }}"
          HTTP_CODE=$(curl -sS -o /tmp/page.html -w "%{http_code}" "https://ai-shopping-intelligence-seven.vercel.app/products/smoke-detail-page-test")
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::detail page did not return 200"
            cat /tmp/page.html
            exit 1
          fi
          if ! grep -qF "$TITLE" /tmp/page.html; then
            echo "::error::detail page did not contain the test product's title"
            cat /tmp/page.html
            exit 1
          fi
          if ! grep -q "Where to buy" /tmp/page.html; then
            echo "::error::detail page did not contain the 'Where to buy' section"
            exit 1
          fi
          echo "PASS: detail page rendered the product correctly"

      - name: Clean up -- delete the test product
        if: always()
        run: |
          PRODUCT_ID="${{ steps.post.outputs.product_id }}"
          if [ -z "$PRODUCT_ID" ]; then
            echo "No product_id captured, nothing to delete"
            exit 0
          fi
          HTTP_CODE=$(curl -sS -o /tmp/delete_resp.json -w "%{http_code}" -X DELETE "https://ai-shopping-intelligence-seven.vercel.app/api/favorite?productId=${PRODUCT_ID}")
          echo "Delete HTTP status: $HTTP_CODE"
          cat /tmp/delete_resp.json
