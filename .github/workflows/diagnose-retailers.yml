name: diagnose-retailers

# Throwaway diagnostic, not a product feature. Two separate investigations:
# 1. Jarir: static HTML probing proved .product-tile is a generic "trending
#    now" widget, identical across totally different queries -- real
#    per-query results must come from a client-side API call. This uses a
#    real headless browser (not curl) to capture network requests during
#    an actual search, to find that endpoint.
# 2. extra: Cloudflare specifically challenges our headless browser (plain
#    curl to the same URL is not challenged). Testing whether basic,
#    legitimate anti-fingerprinting adjustments (hiding navigator.webdriver,
#    realistic headers) are enough -- not pursuing elaborate evasion beyond
#    this.
# To be deleted once answered.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Try Jarir's Constructor.io search backend (seen powering "Search Suggestions")
        run: |
          for q in laptop hp; do
            echo "=== q=$q ==="
            curl -sS "https://ac.cnstrc.com/search/$q?key=key_KcSYfmQTEwRpBnd9&c=cio-fe-web-jarir&s=1&num_results_per_page=10" \
              -H "Accept: application/json" \
              -o "cio-$q.json" -w "HTTP_STATUS:%{http_code}\nSIZE:%{size_download}\n"
          done
          python3 - <<'PY'
          import json

          def walk(obj, path="", depth=0):
              if depth > 5: return
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      walk(v, f"{path}.{k}", depth+1)
              elif isinstance(obj, list):
                  print(f"{path}: list len={len(obj)}", "first item keys:", list(obj[0].keys()) if obj and isinstance(obj[0], dict) else (obj[0] if obj else None))

          for q in ("laptop", "hp"):
              print(f"=== structure for q={q} ===")
              try:
                  data = json.load(open(f"cio-{q}.json", encoding="utf-8"))
              except Exception as e:
                  print("parse failed:", e)
                  print(open(f"cio-{q}.json", encoding="utf-8", errors="replace").read()[:500])
                  continue
              walk(data)
              print()

          try:
              rl = json.load(open("cio-laptop.json", encoding="utf-8")).get("response", {}).get("results", [])
              rh = json.load(open("cio-hp.json", encoding="utf-8")).get("response", {}).get("results", [])
              print("laptop results count:", len(rl))
              for r in rl[:5]:
                  print(" -", {k: r[k] for k in r if k in ("value", "data")})
              print("hp results count:", len(rh))
              for r in rh[:5]:
                  print(" -", {k: r[k] for k in r if k in ("value", "data")})
          except Exception as e:
              print("results extraction failed:", e)
          PY

