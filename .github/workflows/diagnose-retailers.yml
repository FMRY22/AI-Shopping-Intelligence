name: diagnose-retailers

# Throwaway diagnostic, not a product feature: checking whether Jarir and
# Amazon product pages expose an og:image meta tag, which would let a
# one-time backfill fill in image_url for products favorited before
# 2026-07-17's fix (which stored null for all of them) without needing a
# browser -- just a plain fetch + regex per product page. To be deleted
# once answered.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check og:image on sample product pages
        run: |
          for pair in \
            "jarir|https://www.jarir.com/sa-en/apple-macbook-neo-laptops-678954.html" \
            "amazon|https://www.amazon.sa/dp/B0GL948QH1"; do
            name="${pair%%|*}"
            url="${pair#*|}"
            echo "=== $name ==="
            curl -sS "$url" \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
              -o page.html -w "HTTP_STATUS:%{http_code} SIZE:%{size_download}\n"
            grep -oE '<meta[^>]*property="og:image"[^>]*>' page.html | head -2 || echo "no og:image found"
            echo "--- landingImage / data-a-dynamic-image / data-old-hires hints ---"
            grep -oE 'id="landingImage"[^>]{0,300}' page.html | head -1 || true
            grep -oE 'data-old-hires="[^"]*"' page.html | head -1 || true
            grep -oE '"hiRes":"[^"]*"' page.html | head -1 || true
          done
