name: diagnose-retailers

# Throwaway diagnostic, not a product feature: checking why Jarir's search
# for "laptop" via /api/track returned iPhones/iPad instead of laptops
# (2026-07-17). Hypothesis: Jarir's search found 0 real matches for
# "laptop" and redirected/fell back to a generic "Default Category" page
# whose recommended-product tiles happen to use the same .product-tile
# class our selector now matches. Checking (1) whether the raw HTML for
# q=laptop actually contains laptop products anywhere, and (2) whether a
# term Jarir definitely stocks (q=hp, a known laptop brand they carry)
# returns real, on-topic matches with the same selector -- to tell apart
# "selector matches the wrong section of a real results page" from
# "selector is fine, this specific query just has no results". To be
# deleted once answered.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch Jarir q=laptop, locate the no-result marker and its surroundings
        run: |
          curl -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            "https://www.jarir.com/sa-en/catalogsearch/result/?q=laptop" \
            -o laptop.html -w "HTTP_STATUS:%{http_code}\nSIZE:%{size_download}\n"
          python3 - <<'PY'
          html = open("laptop.html", encoding="utf-8", errors="replace").read()
          idx = html.find("term__no-result")
          print("--- 800 chars around first term__no-result ---")
          print(html[max(0, idx-400):idx+400])
          print()
          print("--- classes containing 'recommend' or 'similar' or 'bestsel' or 'trend' or 'search-result' or 'plp' ---")
          import re
          found = set(re.findall(r'class="([^"]*(?:recommend|similar|bestsel|trend|search-result|plp|search__|no-search)[^"]*)"', html, re.I))
          for f in sorted(found)[:20]:
              print(f)
          print()
          print("--- does 'product-tile' appear inside a container near term__no-result (within 3000 chars after)? ---")
          print("product-tile" in html[idx:idx+3000])
          PY

      - name: Fetch Jarir q=hp (known laptop brand) and inspect
        run: |
          curl -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            "https://www.jarir.com/sa-en/catalogsearch/result/?q=hp" \
            -o hp.html -w "HTTP_STATUS:%{http_code}\nSIZE:%{size_download}\n"
          echo "--- does hp.html contain term__no-result? ---"
          grep -c "term__no-result" hp.html || true
          echo "--- first few product-title texts (raw) for q=hp ---"
          grep -oE "<[a-z0-9]+ class=\"product-title[^\"]*\"[^>]*>.{0,200}" hp.html | head -3
