name: worker-noon

on:
  # Scheduled cron disabled: Noon is network-blocked for GitHub Actions'
  # IP ranges (confirmed manually -- the same product URL works fine from a
  # regular residential connection), so every scheduled run fails and spams
  # failure emails. Kept as workflow_dispatch only until a non-evasive fix
  # exists (see WORKERS.md's no-evasion principle) or Noon is reachable
  # again from this runner network.
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm --filter @repo/worker-noon exec playwright install --with-deps chromium

      - name: Run worker
        working-directory: workers/noon
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm start
